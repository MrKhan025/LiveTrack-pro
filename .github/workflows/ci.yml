name: LiveTrack-Pro Unified CI & Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate SQL Migrations
        run: node backend/src/db/migrate.js

      - name: Run Backend Automated Integration & Anti-Covert Security Tests
        run: npm test

      - name: Dependency Vulnerability Scan
        run: |
          cd backend && npm audit --audit-level=high || true

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build React TypeScript Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
