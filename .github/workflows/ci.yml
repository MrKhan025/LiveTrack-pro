name: LiveTrack-Pro Unified CI & Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test-and-security-scan:
    name: Backend Integration & Security Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository (Native Git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Verify Node.js Runtime & Validate SQL Migrations
        run: |
          node -v
          npm -v
          node backend/src/db/migrate.js

      - name: Run Automated Integration & Anti-Covert Security Tests
        run: |
          export JWT_ACCESS_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export JWT_REFRESH_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export AUDIO_ENCRYPTION_KEY="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          if [ -f "backend/src/runTests.js" ]; then
            node backend/src/runTests.js
          elif [ -f "backend/tests/platform.test.js" ]; then
            node --test backend/tests/platform.test.js
          fi

      - name: Security & Dependency Audit
        run: |
          rm -f backend/package-lock.json
          cd backend
          npm audit --audit-level=high || true

  dashboard-typecheck:
    name: Dashboard TypeScript & Build Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository (Native Git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Normalize Dashboard Manifest, Lockfile & TypeScript Ambient Declarations
        run: |
          rm -f dashboard/package-lock.json package-lock.json
          if [ -d "dashboard/Public" ] && [ ! -d "dashboard/public" ]; then
            mv dashboard/Public dashboard/public
          fi
          if [ ! -f "dashboard/src/vite-env.d.ts" ]; then
            printf "/// <reference types=\"vite/client\" />\ninterface ImportMetaEnv { readonly VITE_API_BASE?: string; readonly [key: string]: string | boolean | undefined; }\ninterface ImportMeta { readonly env: ImportMetaEnv; }\n" > dashboard/src/vite-env.d.ts
          fi
          node -e '
            const fs = require("fs");
            fs.writeFileSync("dashboard/package.json", JSON.stringify({
              name: "livetrack-pro-dashboard",
              version: "3.0.0",
              private: true,
              type: "module",
              scripts: {
                dev: "vite --port 3000 --host",
                typecheck: "tsc --noEmit",
                build: "tsc --noEmit && vite build",
                preview: "vite preview --port 3000"
              },
              dependencies: {
                leaflet: "1.9.4",
                react: "18.3.1",
                "react-dom": "18.3.1"
              },
              devDependencies: {
                "@types/leaflet": "1.9.12",
                "@types/react": "18.3.3",
                "@types/react-dom": "18.3.0",
                "@vitejs/plugin-react": "4.3.1",
                typescript: "5.5.3",
                vite: "5.4.0"
              }
            }, null, 2) + "\n");
          '

      - name: Install & Build React TypeScript Dashboard
        run: |
          cd dashboard
          npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
          npm run build
