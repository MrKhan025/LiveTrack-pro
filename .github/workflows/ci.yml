name: LiveTrack-Pro Unified CI & Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test-and-security-scan:
    name: Backend Integration & Security Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository (Native Git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Verify Node.js Runtime & Validate SQL Migrations
        run: |
          node -v
          npm -v
          node backend/src/db/migrate.js

      - name: Run Automated Integration & Anti-Covert Security Tests
        run: node backend/src/runTests.js

      - name: Security & Dependency Audit
        run: |
          cd backend
          npm audit --audit-level=high || true

  dashboard-typecheck:
    name: Dashboard TypeScript & Build Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository (Native Git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install & Build React TypeScript Dashboard
        run: |
          cd dashboard
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
